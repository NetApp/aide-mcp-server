[project]
name = "netapp-data-engine-mcp"
version = "0.2.0"
description = "MCP server with custom AIDP RAG search functionality"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Shreya Menneni", email = "Shreya.Menneni@netapp.com" },
    { name = "Aarkin Karnik", email = "Aarkin.Karnik@netapp.com" },
    { name = "Rom Adams", email = "Rom.Adams@netapp.com" }
]
dependencies = [
    "fastmcp>=3.0.2",
    "httpx>=0.27.0",
]
license = { file="LICENSE" }

[build-system]
requires = [
    "setuptools>=61.0.0", 
    "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
server = "netapp_rag_server.main:main"