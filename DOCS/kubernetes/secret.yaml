apiVersion: v1
kind: Secret
metadata:
  name: aide-mcp-config
  labels:
    app: aide-mcp-server
type: Opaque
# stringData allows us to embed the raw JSON without base64 encoding it manually.
# Kubernetes will automatically base64 encode it internally.
stringData:
  .netapp: |
    {
      "rag_search_api_endpoint_url": "https://example.com/api",
      "verify_ssl": true,
      "auth_flow": "device_code",
      "device_code_endpoint_url": "https://login.microsoftonline.com/<tenant>/oauth2/v2.0/devicecode",
      "token_request_endpoint_url": "https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token",
      "token_request_params": {
        "client_id": "your_client_id",
        "scope": "api://your-app/.default"
      }
    }
